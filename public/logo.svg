<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="chartplus logo">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1222"/>
      <stop offset="100%" stop-color="#0f1e33"/>
    </linearGradient>
    <linearGradient id="cp-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="cp-bull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cp-bear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <!-- پس‌زمینه آیکون -->
  <rect width="120" height="120" rx="27" fill="url(#cp-bg)"/>
  <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="26.25" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- حلقه C با گاف سمت راست-بالا برای علامت + -->
  <path d="M 87 29.8 A 42 42 0 1 0 87 94.2" stroke="url(#cp-ring)" stroke-width="8" stroke-linecap="round" opacity="0.95"/>

  <!-- کندل‌ها داخل C -->
  <rect x="30" y="66" width="9" height="26" rx="2.5" fill="url(#cp-bull)"/>
  <line x1="34.5" y1="58" x2="34.5" y2="66" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="34.5" y1="92" x2="34.5" y2="98" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>

  <rect x="46" y="52" width="9" height="22" rx="2.5" fill="url(#cp-bear)" opacity="0.95"/>
  <line x1="50.5" y1="45" x2="50.5" y2="52" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
  <line x1="50.5" y1="74" x2="50.5" y2="80" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>

  <rect x="62" y="38" width="9" height="30" rx="2.5" fill="url(#cp-bull)"/>
  <line x1="66.5" y1="30" x2="66.5" y2="38" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="66.5" y1="68" x2="66.5" y2="74" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>

  <rect x="78" y="46" width="9" height="14" rx="2.5" fill="url(#cp-bear)" opacity="0.9"/>
  <line x1="82.5" y1="40" x2="82.5" y2="46" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>

  <!-- علامت + -->
  <g fill="#22d3ee">
    <rect x="94" y="10" width="22" height="7" rx="3.5"/>
    <rect x="101.5" y="2.5" width="7" height="22" rx="3.5"/>
  </g>
</svg>
